name: iso-claim-gate
on:
  push:
    paths:
      - "evidence/iso_claim_status.json"
      - "evidence/schemas/iso_claim_status.schema.json"
      - "tools/validate_iso_claim_status.py"
      - "tests/test_iso_claim_gate.py"
      - ".github/workflows/iso-claim-gate.yml"
  pull_request:
    paths:
      - "evidence/iso_claim_status.json"
      - "evidence/schemas/iso_claim_status.schema.json"
      - "tools/validate_iso_claim_status.py"
      - "tests/test_iso_claim_gate.py"
      - ".github/workflows/iso-claim-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install jsonschema pytest
      - name: Validate ISO claim-status register
        run: python tools/validate_iso_claim_status.py evidence/iso_claim_status.json
      - name: Gate unit tests
        run: python -m pytest tests/test_iso_claim_gate.py -q
      - name: Governance reminder
        run: |
          echo "CI pass does not establish ISO conformity"
          echo "CI_GREEN != SWI_AUTHORIZED"
