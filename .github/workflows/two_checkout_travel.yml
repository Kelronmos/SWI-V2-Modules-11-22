name: two-checkout-travel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly current-tip travel proof (UTC).
    # Produces real V1 evidence, admits on V2 without importing swi_core,
    # rejects tamper/bad integrity, post-admission seal, runs V2 suite on 3.10/3.11/3.12.
    - cron: "0 6 * * 1"

jobs:
  produce:
    name: V1 produce evidence
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout V1 only
        uses: actions/checkout@v4
        with:
          repository: Kelronmos/SWI-V1-Module-1-10
          path: v1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install V1 dependencies
        run: |
          python -m venv venv-v1
          venv-v1/bin/pip install -q -r v1/requirements.txt

      - name: Export real V1 evidence
        run: |
          PYTHONPATH=v1 venv-v1/bin/python v1/scripts/export_travel_evidence.py --out evidence.json
          echo "V1_SHA=$(git -C v1 rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "V1 commit: $(git -C v1 rev-parse HEAD)"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1-foundation-evidence
          path: evidence.json
          retention-days: 14

  admit:
    name: V2 admit without V1 tree
    needs: produce
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout V2 only
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install V2 dependencies only
        run: |
          python -m venv venv-v2
          venv-v2/bin/pip install -q -r requirements.txt

      - name: Download V1 evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: v1-foundation-evidence
          path: .

      - name: Assert V1 package not importable
        run: |
          if venv-v2/bin/python -c "import swi_core" 2>/dev/null; then
            echo "FAIL: swi_core (V1) is importable in V2 job" >&2
            exit 1
          fi
          echo "PASS: V1 swi_core not importable"

      - name: Admit valid evidence
        run: |
          echo "V2 commit: $(git rev-parse HEAD)"
          PYTHONPATH=. venv-v2/bin/python scripts/admit_travel_evidence.py --in evidence.json

      - name: Reject tampered payload
        run: |
          python -c "import json;d=json.load(open('evidence.json'));d['payload']=dict(d['payload']);d['payload']['allowed']=not d['payload'].get('allowed', True);json.dump(d,open('evidence_tampered.json','w'))"
          if PYTHONPATH=. venv-v2/bin/python scripts/admit_travel_evidence.py --in evidence_tampered.json; then
            echo "FAIL: tampered admitted" >&2
            exit 1
          fi
          echo "PASS: tamper rejected"

      - name: Reject bad integrity field
        run: |
          python -c "import json;d=json.load(open('evidence.json'));d['integrity_reference']='0'*64;json.dump(d,open('evidence_bad_hash.json','w'))"
          if PYTHONPATH=. venv-v2/bin/python scripts/admit_travel_evidence.py --in evidence_bad_hash.json; then
            echo "FAIL: bad hash admitted" >&2
            exit 1
          fi
          echo "PASS: bad integrity rejected"

      - name: Post-admission seal + verify + tamper reject
        run: |
          echo "V2 commit: $(git rev-parse HEAD)"
          PYTHONPATH=. venv-v2/bin/python scripts/seal_travel_evidence.py --in evidence.json

      - name: Unit tests (V2 isolation)
        run: |
          PYTHONPATH=. venv-v2/bin/python -m pytest -q
