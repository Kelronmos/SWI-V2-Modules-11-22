name: SWI Trusted-Source Spine

on:
  push:
    branches: [main, master]
    paths:
      - "swi_v2/trusted_source/**"
      - "scripts/swi_trusted_source_spine_*"
      - "evidence/trusted_source_boundary*"
      - "docs/SWI_TRUSTED_SOURCE*"
      - "test/test_trusted_source_spine_inspector.py"
      - "test/fixtures/trusted_source/**"
      - ".github/workflows/trusted_source_boundary.yml"
  pull_request:
    paths:
      - "swi_v2/trusted_source/**"
      - "scripts/swi_trusted_source_spine_*"
      - "evidence/trusted_source_boundary*"
      - "docs/SWI_TRUSTED_SOURCE*"
      - "test/test_trusted_source_spine_inspector.py"
      - "test/fixtures/trusted_source/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spine-inspect:
    name: Trusted-source spine (structural only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (spine inspector)
        run: python -m pytest -q test/test_trusted_source_spine_inspector.py

      - name: Automated spine inspect (placeholder evidence)
        run: python scripts/swi_trusted_source_spine_inspect.py evidence/trusted_source_boundary_placeholder.json

      - name: Manual independent spine grep
        run: bash scripts/swi_trusted_source_spine_manual.sh

      - name: Record non-claims
        if: always()
        run: |
          echo "STRUCTURAL GREEN != TRUSTED SOURCE PROVEN"
          echo "STRUCTURAL GREEN != AUTHORITY PROVEN"
          echo "STRUCTURAL GREEN != SWI PRODUCTION AUTHORIZED"
          echo "STANDARD != LAW"
          echo "SOURCE != AUTHORIZATION"
          echo "CI_GREEN != PRODUCTION_AUTHORIZATION"
