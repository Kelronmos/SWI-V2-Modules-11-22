name: LAW INGESTION ADVERSARIAL

on:
  push:
    branches:
      - experimental/law-ingestion-lane
    paths:
      - "experimental/law/**"
      - "tests/law/**"
      - ".github/workflows/law_adversarial.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experimental/law/**"
      - "tests/law/**"

jobs:
  law-adversarial:
    name: Law adversarial suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run dedicated law adversarial gate
        run: python -m pytest -q tests/law/
      - name: Record result
        if: always()
        run: |
          echo "LAW_ADVERSARIAL_GATE=executed" >> $GITHUB_STEP_SUMMARY
          echo "Tip: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
