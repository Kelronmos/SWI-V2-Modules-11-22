name: SWI V2 Modules 11-22 Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-verification:
    name: Repository Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository is not shallow
        shell: bash
        run: |
          echo "Checking Git repository depth..."
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Record Git state
        shell: bash
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "BRANCH=$(git branch --show-current || true)"
          echo "SHALLOW=$(git rev-parse --is-shallow-repository)"
          git log -5 --oneline

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q swi_v2
      - name: Module 11 and contract tests
        run: python -m pytest -q test/test_module11_admission.py test/test_foundation_contract.py
      - name: Full suite
        run: python -m pytest -q
      - name: verify.sh
        if: matrix.python-version == '3.12'
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh

  final-verification:
    name: Final SWI V2 Verification Summary
    needs: [repository-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "SWI V2 Modules 11-22 CI Verification Passed"
          echo "Configured automated checks passed for this commit and environments."
          echo "This is NOT a claim of universal AI safety or complete cybersecurity."
          echo "Module 11 is not sealed until V1 releases a real foundation evidence contract."
